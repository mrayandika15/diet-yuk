<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#426C50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Raka &amp; Anggun" />
    <meta
      name="description"
      content="Catatan makan dan perjalanan sehat Raka &amp; Anggun."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #fff9f4;
      }
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          fetch("/sw.js", { method: "HEAD" })
            .then(function (response) {
              if (response.ok)
                return navigator.serviceWorker.register("/sw.js");
            })
            .catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <noscript
      >Aktifkan JavaScript untuk membuka catatan Raka &amp; Anggun.</noscript
    >
    <div id="root"></div>
  </body>
</html>
