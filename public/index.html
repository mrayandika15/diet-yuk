<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#426C50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Raka &amp; Anggun" />
    <meta
      name="description"
      content="Catatan makan dan perjalanan sehat Raka &amp; Anggun."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #fff9f4;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        height: var(--app-height, 100dvh);
        min-height: 0;
        flex: 1;
      }
      button,
      [role="button"],
      [role="tab"] {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      :is(
        button,
        [role="button"],
        [role="tab"],
        input,
        textarea
      ):focus-visible {
        outline: 2px solid #426c50;
        outline-offset: 3px;
      }
      input,
      textarea {
        font-size: 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script>
      (function () {
        var viewport = window.visualViewport;
        var frame;
        function updateHeight() {
          if (viewport && viewport.scale !== 1) return;
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(function () {
            document.documentElement.style.setProperty(
              "--app-height",
              (viewport ? viewport.height : window.innerHeight) + "px",
            );
          });
        }
        updateHeight();
        window.addEventListener("resize", updateHeight);
        if (viewport) viewport.addEventListener("resize", updateHeight);
      })();
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          fetch("/sw.js", { method: "HEAD" })
            .then(function (response) {
              if (response.ok)
                return navigator.serviceWorker.register("/sw.js");
            })
            .catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <noscript
      >Aktifkan JavaScript untuk membuka catatan Raka &amp; Anggun.</noscript
    >
    <div id="root"></div>
  </body>
</html>
